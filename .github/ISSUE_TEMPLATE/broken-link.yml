name: Report a problem with a file
description: Wrong content, misleading name or license problem. (Links that stop working are flagged automatically by the daily check.)
labels: ["problem"]
body:
  - type: input
    id: id
    attributes:
      label: Entry id or URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
    validations:
      required: true
