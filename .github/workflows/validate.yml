name: Validate

# Runs on every pull request, including PRs from forks. It only reads the repository and
# never sees secrets: `pull_request` (not `pull_request_target`) runs fork code with a
# read-only token, so a malicious PR can't touch anything.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema, rules & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Schemas are generated from spec.mjs
        run: node scripts/schema.mjs --check
      - name: Catalog rules
        run: node scripts/validate.mjs
      - name: Unit tests
        run: node --test
      - name: Build succeeds
        run: node scripts/build.mjs --out "$RUNNER_TEMP/dist"

      - name: No status/ files in PRs
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --name-only "$BASE...HEAD" -- status | grep -q .; then
            echo "::error::Please don't add status/ — link health is generated by the daily check on the link-status branch. Remove those files and push again."
            exit 1
          fi

  links:
    name: New & changed links work
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe every link this PR adds or changes
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/check-links.mjs --changed "$BASE" --strict --dry
