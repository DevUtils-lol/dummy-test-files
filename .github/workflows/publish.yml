name: Publish

# Builds the catalog and publishes it to the `dist` branch.
#
# Apps read:  https://raw.githubusercontent.com/DevUtils-lol/dummy-test-files/dist/v1/index.json
#   (tiny, 5-minute cache) whose "commit" field pins the shards to an exact dist commit:
#             https://cdn.jsdelivr.net/gh/DevUtils-lol/dummy-test-files@<commit>/v1/shards/…
#   (immutable, cached forever). Updates are live within ~5 minutes of a merge.
#
# Runs after every merge to main, and is called by the daily link check.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate
        run: node scripts/validate.mjs

      - name: Fetch link health
        run: |
          if git ls-remote --exit-code --heads origin link-status >/dev/null; then
            git fetch --depth=1 origin link-status
            git worktree add .link-status origin/link-status
          else
            echo "::warning::No link-status branch yet — publishing with every entry marked unchecked."
            mkdir -p .link-status/status
          fi

      - name: Check out the dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin dist >/dev/null; then
            git fetch --depth=1 origin dist
            git worktree add -B dist out origin/dist
          else
            git worktree add --orphan -b dist out
          fi

      - name: Build
        env:
          TEST_FILES_STATUS_DIR: .link-status/status
        run: |
          node scripts/build.mjs --out out
          cp dist-README.md out/README.md

      - name: Commit (index pinned to the exact dist commit) & push
        id: push
        run: |
          node scripts/publish-dist.mjs out --message "build ${GITHUB_SHA::7}" | tee -a /dev/stderr | grep '^changed=' >> "$GITHUB_OUTPUT"
          git -C out push origin dist

      # Apps read index.json from raw.githubusercontent.com (5-minute cache) and shards from
      # jsDelivr pinned to the commit in index.json, so no purge is needed for freshness.
      # The jsDelivr @dist copy is only a last-resort fallback; refresh it best-effort.
      - name: Refresh the jsDelivr fallback (best effort)
        if: steps.push.outputs.changed == 'true'
        continue-on-error: true
        run: |
          for f in v1/index.json v1/all.json; do
            curl -fsS --retry 2 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@dist/$f" >/dev/null && echo "purged $f" || echo "purge failed for $f (fallback only)"
          done
