name: Daily link check

# Probes every link once a day, commits the results to status/ and republishes, so dead
# links disappear from apps automatically (after 3 failed days in a row) and recovered
# ones come back.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every link
        run: node scripts/check-links.mjs

      - name: Commit status
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "chore(status): daily link check"
          git pull --rebase -q origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so publish explicitly.
  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
