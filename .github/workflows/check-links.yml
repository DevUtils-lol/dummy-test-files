name: Daily link check

# Probes every link once a day and saves the results on the `link-status` branch, then
# republishes, so dead links disappear from apps automatically (after 3 failed days in a
# row) and recovered ones come back.
#
# Why a separate branch: `main` is protected (every change needs a reviewed PR) and the
# Actions bot can't bypass that without a personal token. `link-status` holds only
# generated health data, is written only by this workflow, and needs no protection.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out link-status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin link-status >/dev/null; then
            git fetch --depth=1 origin link-status
            git worktree add -B link-status .link-status origin/link-status
          else
            git worktree add --orphan -b link-status .link-status
          fi

      - name: Check every link
        env:
          TEST_FILES_STATUS_DIR: .link-status/status
        run: node scripts/check-links.mjs

      - name: Save results
        id: commit
        working-directory: .link-status
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "link check $(date -u +%F)"
          git push origin link-status
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so publish explicitly.
  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
